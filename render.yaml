services:
  # Backend API (FastAPI)
  - type: web
    name: smartrx-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/sql_app.db
      - key: OPENAI_API_KEY
        sync: false # You will fill this on Render (Nvidia NIM API Key)
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret
      - key: FRONTEND_URL
        sync: false # Put your frontend's public Render URL here (e.g. https://smartrx-frontend.onrender.com)

  # Frontend Application (Next.js)
  - type: web
    name: smartrx-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Put your backend's public Render URL here (e.g. https://smartrx-backend.onrender.com)
